name: verify

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: asdf-vm/actions/install@v3
      - run: npm ci
      - name: Install application dependencies
        run: |
          for directory in simple-01/* prisma-01/* usecases-01/* hexagonal-01/* typescript-01/* ddd-01/*; do
            (cd "$directory" && npm ci)
          done
      - run: npm run verify:structure
      - run: npm run verify:contracts
      - run: npm run verify:apps
      - run: npm run verify:start
      - run: npm run docs:build
      - run: npm run docs:lint
