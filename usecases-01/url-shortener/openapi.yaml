openapi: 3.1.0
info: {title: Prisma URL Shortener API, version: 0.1.0}
paths:
  /api/v1/links:
    post: {summary: Create a link, responses: {'201': {description: Created}, '400': {description: Invalid request}}}
    get: {summary: List owned links, responses: {'200': {description: Links}}}
  /api/v1/links/{alias}:
    parameters: [{in: path, name: alias, required: true, schema: {type: string}}]
    patch: {summary: Update a link, responses: {'200': {description: Updated}, '403': {description: Forbidden}}}
    delete: {summary: Delete a link, responses: {'204': {description: Deleted}, '403': {description: Forbidden}}}
  /{alias}:
    parameters: [{in: path, name: alias, required: true, schema: {type: string}}]
    get: {summary: Resolve a link, responses: {'302': {description: Redirect}, '404': {description: Unavailable}}}
components:
  securitySchemes:
    DevelopmentUser: {type: apiKey, in: header, name: X-User-Id}
  parameters:
    Alias: {in: path, name: alias, required: true, schema: {type: string, pattern: '^[a-zA-Z0-9_-]{3,64}$'}}
  schemas:
    CreateLink:
      type: object
      required: [destination_url]
      properties:
        destination_url: {type: string, format: uri, maxLength: 2048}
        alias: {type: string, pattern: '^[a-zA-Z0-9_-]{3,64}$'}
        expires_at: {type: string, format: date-time}
    LinkResponse:
      type: object
      required: [data]
      properties: {data: {type: object}}

