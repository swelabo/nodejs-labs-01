openapi: 3.1.0
info: {title: Simple Blog API, version: 0.1.0}
paths:
  /api/v1/pages/{slug}:
    get:
      summary: Read a published page
      parameters: [{in: path, name: slug, required: true, schema: {type: string}}]
      responses: {'200': {description: Published page}, '404': {description: Not found}}
  /api/v1/pages:
    post: {summary: Create a page draft, security: [{DevelopmentUser: []}], responses: {'201': {description: Page}, '403': {description: Forbidden}}}
  /api/v1/pages/{id}:
    patch: {summary: Edit a page, security: [{DevelopmentUser: []}], responses: {'200': {description: Updated page}, '403': {description: Forbidden}}}
  /admin:
    get: {summary: Render the administration dashboard, security: [{DevelopmentUser: []}], responses: {'200': {description: Dashboard}, '403': {description: Forbidden}}}
  /api/v1/categories:
    get: {summary: List hierarchical categories, responses: {'200': {description: Categories}}}
    post: {summary: Create a category, security: [{DevelopmentUser: []}], responses: {'201': {description: Category}, '400': {description: Invalid category}, '403': {description: Forbidden}}}
  /api/v1/tags:
    get: {summary: List tags, responses: {'200': {description: Tags}}}
    post: {summary: Create a tag, security: [{DevelopmentUser: []}], responses: {'201': {description: Tag}, '403': {description: Forbidden}}}
  /api/v1/site-config:
    get: {summary: Read site configuration, security: [{DevelopmentUser: []}], responses: {'200': {description: Configuration}, '403': {description: Forbidden}}}
    patch: {summary: Update site configuration, security: [{DevelopmentUser: []}], responses: {'200': {description: Configuration}, '403': {description: Forbidden}}}
  /api/v1/taxonomies:
    get: {summary: List custom taxonomies, responses: {'200': {description: Taxonomies}}}
    post: {summary: Create a custom taxonomy, security: [{DevelopmentUser: []}], responses: {'201': {description: Taxonomy}, '403': {description: Forbidden}}}
  /api/v1/taxonomies/{taxonomy}/terms:
    get: {summary: List taxonomy terms, responses: {'200': {description: Terms}, '404': {description: Not found}}}
    post: {summary: Create a taxonomy term, security: [{DevelopmentUser: []}], responses: {'201': {description: Term}, '400': {description: Invalid term}}}
  /authors/{slug}:
    get: {summary: Render an author's published posts, responses: {'200': {description: Author archive}, '404': {description: Not found}}}
  /author/{slug}:
    get: {summary: Singular alias for an author's published posts, responses: {'200': {description: Author archive}, '404': {description: Not found}}}
  /archives/{year}:
    get: {summary: Render a yearly archive, responses: {'200': {description: Archive}}}
  /archives/{year}/{month}:
    get: {summary: Render a monthly archive, responses: {'200': {description: Archive}}}
  /archive/{year}:
    get: {summary: Singular alias for a yearly archive, responses: {'200': {description: Archive}}}
  /archive/{year}/{month}:
    get: {summary: Singular alias for a monthly archive, responses: {'200': {description: Archive}}}
  /category/{slug}:
    get: {summary: Render a category listing, responses: {'200': {description: Category listing}}}
  /tag/{slug}:
    get: {summary: Render a tag listing, responses: {'200': {description: Tag listing}}}
  /search:
    get: {summary: Search published posts, responses: {'200': {description: Search results}}}
  /api/v1/auth/login:
    post: {summary: Create a session, responses: {'200': {description: Authenticated}, '403': {description: Invalid credentials}}}
  /api/v1/auth/logout:
    post: {summary: Revoke the current session, responses: {'204': {description: Logged out}}}
  /api/v1/posts:
    get: {summary: List published posts, responses: {'200': {description: Paginated posts}}}
    post:
      summary: Create a post draft
      security: [{DevelopmentUser: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PostInput'}}}}
      responses: {'201': {description: Draft created}, '403': {description: Insufficient role}}
  /api/v1/posts/{slug}:
    parameters: [{'$ref': '#/components/parameters/Slug'}]
    get: {summary: Read a published post, responses: {'200': {description: Published post}, '404': {description: Not found}}}
  /api/v1/posts/{id}:
    parameters: [{in: path, name: id, required: true, schema: {type: integer}}]
    patch: {summary: Edit a post, security: [{DevelopmentUser: []}], responses: {'200': {description: Updated}, '403': {description: Forbidden}, '404': {description: Not found}}}
    delete: {summary: Delete a post, security: [{DevelopmentUser: []}], responses: {'204': {description: Deleted}, '403': {description: Forbidden}, '404': {description: Not found}}}
  /api/v1/posts/{slug}/comments/challenge:
    parameters: [{'$ref': '#/components/parameters/Slug'}]
    get: {summary: Issue a short-lived one-time comment challenge, responses: {'200': {description: Challenge}}}
  /api/v1/posts/{slug}/comments:
    parameters: [{'$ref': '#/components/parameters/Slug'}]
    post: {summary: Submit a comment for moderation, responses: {'201': {description: Pending comment}, '400': {description: Invalid challenge}}}
  /api/v1/comments/pending:
    get: {summary: List comments awaiting moderation, security: [{DevelopmentUser: []}], responses: {'200': {description: Pending comments}, '403': {description: Forbidden}}}
  /api/v1/comments/{id}:
    parameters: [{in: path, name: id, required: true, schema: {type: integer}}]
    patch: {summary: Moderate a comment, security: [{DevelopmentUser: []}], responses: {'200': {description: Moderated comment}, '403': {description: Forbidden}}}
  /feed.xml:
    get: {summary: Atom feed of published posts, responses: {'200': {description: Atom feed}}}
  /sitemap.xml:
    get: {summary: Sitemap of published posts, responses: {'200': {description: Sitemap}}}
  /api/v1/admin/users:
    get: {summary: List users, security: [{DevelopmentUser: []}], responses: {'200': {description: Users}, '403': {description: Forbidden}}}
    post: {summary: Create a user, security: [{DevelopmentUser: []}], responses: {'201': {description: Created user}, '403': {description: Forbidden}}}
  /api/v1/admin/users/{id}:
    parameters: [{in: path, name: id, required: true, schema: {type: string}}]
    patch: {summary: Change a user role, security: [{DevelopmentUser: []}], responses: {'200': {description: Updated user}, '403': {description: Forbidden}}}
components:
  securitySchemes: {DevelopmentUser: {type: apiKey, in: header, name: X-User-Id}}
  parameters: {Slug: {in: path, name: slug, required: true, schema: {type: string, pattern: '^[a-z0-9-]{1,128}$'}}}
  schemas:
    PostInput:
      type: object
      required: [slug, title, body]
      properties:
        slug: {type: string, pattern: '^[a-z0-9-]{1,128}$'}
        title: {type: string, minLength: 1, maxLength: 200}
        body: {type: string, minLength: 1}
        status: {type: string, enum: [draft, scheduled, published]}
        publish_at: {type: string, format: date-time}

